name: Generate snake animation

on:
  # every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # also runs when you push to the profile repo
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reads the contribution graph of the repo owner and draws a snake over it.
      # One file for light mode, one for dark mode, both in the teal palette.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#062326&color_dots=#e3f3f0,#A5E6E2,#77DAD7,#36B8B7,#0A858C
            dist/github-snake-dark.svg?color_snake=#f4f1ea&color_dots=#161b22,#0B757B,#36B8B7,#77DAD7,#A5E6E2

      # Pushes the SVGs to a branch called "output" (created on the first run).
      # The README loads them from there.
      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
